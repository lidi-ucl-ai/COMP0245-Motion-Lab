[workspace]
name = "comp0245-motion-lab"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.14.*"
pinocchio = "==4.1.0"
pybullet = "==3.25"
numpy = "==2.5.3"
scipy = "==1.18.1"
scikit-learn = "==1.9.1"
casadi = "==3.7.2"
matplotlib = "==3.11.2"
robot_descriptions = "==3.2.0"
osqp = "==1.1.3"

[pypi-dependencies]
torch = "==2.14.1"

[tasks]
demo = "python webapp/server.py"
evaluate = "python evaluate.py"
smoke = "python evaluate.py --smoke"
